version: "2"

tunnels:
  ms-factura:
    proto: http
    addr: localhost:8080
    inspect: true

  ms-cliente:
    proto: http
    addr: localhost:8081
    inspect: true


log_level: info
log_format: json

# Región del servidor ngrok (us, eu, ap, au, sa, jp, in)
region: us

# Update check
update_check: false

# Metadata para identificar el túnel
metadata: '{"service": "facturas-api", "environment": "development"}'