version: '3.8'

services:

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-gateway
    network_mode: host
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    environment:
      # Obtén tu authtoken desde: https://dashboard.ngrok.com/get-started/your-authtoken
      - NGROK_AUTHTOKEN=3CMrZDucumKhDfNBr2D6hDaBl6l_4UdDCMmeGUwYnAZgHyzVu
    restart: unless-stopped


