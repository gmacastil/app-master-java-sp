apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mscliente-hpa
  namespace: app-micros
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mscliente
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80