services:
  mscliente:
    container_name: mscliente
    image: ms-cliente:6
    ports:
      - "7080:8081"
    environment:
      JAVA_OPTS: "-Xmx256m"
      MONGO_HOST: "mongodb"
      MONGO_PORT: "27017"
      MONGO_DATABASE: "cliente_db"
      MONGO_USERNAME: "admin"
      MONGO_PASSWORD: "password123"
      FACTURAS_SERVICE_URL: "http://msfacturas:8080"
      LOGSTASH_HOST: "logstash:9201"
    networks:
      - minet

networks:
 minet:
   external: true
 