# ================================================
# Configuración avanzada de OpenFeign (EJEMPLO)
# ================================================
# Este archivo NO está activo por defecto
# Copia las propiedades que necesites a application.properties

# URL del servicio de facturas
facturas.service.url=${FACTURAS_SERVICE_URL:http://localhost:8080}

# Configuración de timeouts para Feign
feign.client.config.facturas-service.connectTimeout=5000
feign.client.config.facturas-service.readTimeout=5000

# Nivel de logging para Feign
# Opciones: NONE, BASIC, HEADERS, FULL
feign.client.config.facturas-service.loggerLevel=BASIC

# Configuración de reintentos
# Por defecto Feign no reintenta, pero puedes configurarlo
feign.client.config.facturas-service.retryer=feign.Retryer.Default

# Configuración de compresión
feign.compression.request.enabled=true
feign.compression.request.mime-types=application/json,application/xml
feign.compression.request.min-request-size=2048
feign.compression.response.enabled=true

# Circuit Breaker con Resilience4j (requiere dependencia adicional)
# spring.cloud.openfeign.circuitbreaker.enabled=true
